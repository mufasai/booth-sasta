#root{height:100%;display:flex;flex-direction:column;padding:27vh 14px 70px}
.hd{align-self:center;text-align:center;background:var(--card);border-radius:16px;padding:8px 18px;margin-bottom:8px;box-shadow:0 4px 18px rgba(31,78,140,.15);max-width:96%}
h1{margin:0;font-size:clamp(17px,3.6vmin,32px);font-weight:800;color:var(--navy)}
.hd p{margin:2px 0 0;font-size:clamp(11px,1.9vmin,16px);color:var(--muted);font-weight:600}
.bub{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}.rw{display:flex;justify-content:center;gap:8px}
.b{border:3px solid #fff;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit;padding:0;-webkit-tap-highlight-color:transparent;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.b img{width:62%;height:62%;object-fit:contain}
.b span{font-weight:800;line-height:1}
.b small{font-weight:700;text-align:center;line-height:1.15;padding:0 8%;margin-top:4px}
.b.pop{animation:bp .4s}
@keyframes bp{40%{filter:brightness(1.25)}}
.res{flex:1;min-height:0;overflow:auto;background:var(--card);border-radius:20px;padding:14px;max-width:900px;width:100%;margin:0 auto;box-shadow:0 10px 40px rgba(31,78,140,.15)}
.tot{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.rk{font-weight:800;color:var(--muted);font-size:13px;text-align:right}
.bar{height:30px;background:var(--track);border-radius:9px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:9px;opacity:.6}
.bn{position:absolute;left:10px;top:0;line-height:30px;font-size:12px;font-weight:700;white-space:nowrap}
.rv{font-weight:800;font-size:13px;min-width:34px;text-align:right}
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:99px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:98vw;overflow-x:auto}
.nav button{border:0;background:transparent;color:var(--muted);font:700 11px Montserrat,sans-serif;padding:9px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.nav button[aria-pressed=true]{background:var(--navy);color:#fff}
.sep{width:1px;background:var(--line);flex:none}
button:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:5;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

var T={edu:["Booth Teredukatif","Booth mana yang paling bikin kamu paham?"],inter:["Booth Terinteraktif","Booth mana yang paling seru buat kamu?"]};

var D={edu:N.map(function(){return Math.floor(rnd()*40)}),inter:N.map(function(){return Math.floor(rnd()*40)})};

S.booth=x.dataset.b;S.page=x.dataset.p;nav();draw()};
function draw(){var r=document.getElementById("root"),t=T[S.booth],d=D[S.booth];

N.forEach(function(n,i){if(i===0||i===8||i===15)h+='<div class="rw">';h+='<button class="b" data-i="'+i+'" style="background:'+C[i%6]+'" aria-label="Pilih '+n+'">'+(LOGO[n]?'<img src="'+LOGO[n]+'" alt="">':'<span>'+ini(n)+'</span><small>'+n+'</small>')+'</button>';if(i===7||i===14||i===21)h+='</div>'});
r.innerHTML=h+'</div>';lay();return}
var a=N.map(function(n,i){return{n:n,c:d[i]}}).sort(function(x,y){return y.c-x.c}),mx=a[0].c||1,sum=a.reduce(function(s,x){return s+x.c},0);

a.forEach(function(x,k){h2+='<div class="row"><div class="rk">'+(k+1)+'</div><div class="bar"><div class="fill" style="width:'+(x.c/mx*100)+'%;background:'+(k===0?"#d99a00":k===1?"#1f4e8c":k===2?"#3d9a5b":"#9db3d6")+'"></div><span class="bn">'+x.n+'</span></div><div class="rv">'+x.c+'</div></div>'});
r.innerHTML=h2+'</div>'}
function lay(){var b=document.getElementById("bub");if(!b)return;var W=b.clientWidth,Hh=b.clientHeight,z=Math.max(30,Math.floor(Math.min((W-7*8)/8,(Hh-2*8)/3,150)));
[].forEach.call(b.querySelectorAll(".b"),function(el,i){el.style.width=el.style.height=z+"px";var f=el.firstChild;if(f.tagName==="SPAN"){f.style.fontSize=Math.round(z*.3)+"px";var sm=el.lastChild;sm.style.fontSize=Math.max(9,Math.round(z*.1))+"px";sm.style.display=z>=88?"block":"none"}})}
document.getElementById("root").onclick=function(e){var c=e.target.closest("[data-i]");if(!c)return;var i=+c.dataset.i;D[S.booth][i]++;lay();
c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");toast("Terima kasih! Suara untuk "+N[i]+" tercatat.")};
window.addEventListener("resize",lay);
nav();draw();
